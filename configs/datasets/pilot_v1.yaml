# Pilot multi-FSED dataset (reproduces legacy Experiment 06; 3 seeds x 15 counterfactual pairs).
#
# Resumability rules:
#  * Pair ids are stable. Append new levels at the END of a list (stuck_actuator ids use the
#    1-based level index); never reorder or edit existing levels.
#  * Raising n_seeds only adds pairs: scenario seeds come from one sequential RNG stream.
#  * Changing anything under the hashed keys (everything except n_seeds and the level lists)
#    marks existing pairs "stale" instead of silently overwriting them.
dataset_id: pilot_v1
description: Pilot dataset from the five physics-validated FSED mechanisms.

n_steps: 48               # 10-minute steps (dcngen solver.dt)
n_seeds: 3
healthy_ua_factor: 1.05   # sizing margin on design UA, within dcngen's 1.00-1.10 band
pump_curve: plant_pump_curve

filter:                   # clogged-filter mechanism: passive minor loss ahead of the ETS FCV
  k_clean: 1.0
  length_m: 0.01
  u_prime: 1.0e-6         # W/(m K); numerical thermal regularisation for the 1 cm link

# Severity levels are simulation-defined sensitivity levels, not universal thresholds.
fsed:
  stuck_actuator:
    severity_parameter: onset_fraction
    levels: [0.25, 0.50, 0.75]
  poor_balancing:
    severity_parameter: flow_multiplier
    levels: [0.90, 0.80, 0.70]
  excess_control_margin:
    severity_parameter: head_multiplier
    levels: [1.10, 1.20, 1.30]
  clogged_filter:
    severity_parameter: filter_K
    levels: [5.0, 10.0, 20.0]
  hx_fouling:
    severity_parameter: ua_multiplier
    levels: [0.85, 0.70, 0.50]
